name: MUN API contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shared-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check api/_shared.js
      - run: node --test tests/shared.test.cjs
